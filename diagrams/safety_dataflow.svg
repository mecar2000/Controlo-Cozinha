<text xml:space="preserve" text-anchor="middle" x="967.25" y="-116.72" font-family="Segoe UI" font-size="9.50" fill="#0f1720">No veto layer, no latch object, no second source of truth.</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-103.22" font-family="Segoe UI" font-size="9.50" fill="#0f1720">dangerActive() runs at the TOP of update(), before any per&#45;state logic.</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-89.72" font-family="Segoe UI" font-size="9.50" fill="#0f1720">If it holds, the machine transitions to FULLY_VENTILATING and update()</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-76.22" font-family="Segoe UI" font-size="9.50" fill="#0f1720">returns that state&#39;s fixed outputs on the SAME PASS: gasOpen=false,</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-62.73" font-family="Segoe UI" font-size="9.50" fill="#0f1720">setpoint=0V, all registers open, fan=100%, alarmOn=true.</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-38.23" font-family="Segoe UI" font-size="9.50" fill="#0f1720">The website cannot reach the pins: the branches that read RunSpec are</text>
<text xml:space="preserve" text-anchor="middle" x="967.25" y="-24.73" font-family="Segoe UI" font-size="9.50" fill="#0f1720">unreachable while a danger condition holds. State and pins never disagree.</text>
</g>
