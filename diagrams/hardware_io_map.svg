<text xml:space="preserve" text-anchor="middle" x="2773.25" y="-153.57" font-family="Segoe UI" font-size="9.00" fill="#0f1720">and all 8 are used above. The SECOND independent gas cut is</text>
<text xml:space="preserve" text-anchor="middle" x="2773.25" y="-140.82" font-family="Segoe UI" font-size="9.00" fill="#0f1720">O2 driven to 0 V, not a relay. The fan contactor follows the</text>
